[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
fragment = "1.9.1"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.2.1"
coroutines = "1.11.0"
serialization = "1.11.0"
